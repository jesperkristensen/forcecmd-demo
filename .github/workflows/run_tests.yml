name: run_tests
on:
  schedule:
  - cron: "0 4 * * *"
  workflow_dispatch:
jobs:
  run_tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: latest
        package-manager-cache: false
    - name: npm install
      run: npm install --allow-git=root
    - name: run tests
      run: npx forcecmd deploy '--options={"checkOnly":true,"testLevel":"RunLocalTests","rollbackOnError":false}' --save-test-result
      env:
        SF_CLIENT_SECRET: ${{ secrets.SALESFORCE_CLIENT_SECRET }}
